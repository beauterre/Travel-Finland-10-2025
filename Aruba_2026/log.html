<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Travel Log (Lazy Load)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<style>
  body { font-family: sans-serif; margin: 20px; background: #f0f0f0; }
  h1 { text-align: center; }
  #searchBox { width: 100%; max-width: 500px; padding: 8px; margin: 20px auto; display: block; }
  .entry {
  display: flex;
  flex-wrap: nowrap;        /* prevent wrapping of main columns */
  gap: 10px;
  padding: 10px;
  border-radius: 6px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}
  .entry > div:first-child {
  display: flex;            /* stack iframe + map vertically */
  flex-direction: column;
  gap: 10px;
}
  .entry.even { background: #ffffff; }
  .entry.odd { background: #e9f5ff; }
  iframe, .map { width: 480px; height: 270px; border: 0; }
  .description { max-width: 480px; white-space: pre-wrap; }
  .title { font-weight: bold; margin-bottom: 5px; }
  .date { font-size: 0.85em; color: #555; margin-bottom: 5px; }
</style>
</head>
<body>

<h1 style="display: flex; align-items: center; gap: 10px; font-size: 1.8em;">
  Travel Log v27-02-2026-00:51
  <a href="https://www.youtube.com/channel/UCpmL04Tei28Vunnw2p-_zUw" target="_blank" style="text-decoration: none; color: red;">
    <!-- YouTube icon SVG -->
    <svg height="24" width="24" viewBox="0 0 24 24" fill="red" xmlns="http://www.w3.org/2000/svg">
      <path d="M23.498 6.186c-.272-1.023-1.076-1.828-2.1-2.1C19.366 3.5 12 3.5 12 3.5s-7.366 0-9.398.586c-1.023.272-1.828 1.077-2.1 2.1C0 8.218 0 12 0 12s0 3.782.502 5.814c.272 1.023 1.077 1.828 2.1 2.1C4.634 20.5 12 20.5 12 20.5s7.366 0 9.398-.586c1.024-.272 1.828-1.077 2.1-2.1.502-2.032.502-5.814.502-5.814s0-3.782-.502-5.814zM9.75 15.02V8.98l6 3.02-6 3.02z"/>
    </svg>
  </a>
</h1>
  <input type="text" id="searchBox" placeholder="Search #hashtags or keywords...">
<div id="feed"></div>

<script>
// CONFIG
const API_KEY = "AIzaSyARU1uXNPtCeA4MLX4so2VpVE028A4BNig"; // YouTube Data API key
const CHANNEL_ID = "UCpmL04Tei28Vunnw2p-_zUw";
const MAX_RESULTS = 10; // lazy load in chunks of 10
let nextPageToken = "";
let allVideoEntries = [];

// UTILS
function formatDate(dateStr) {
  const d = new Date(dateStr);
  return d.toLocaleString();
}
function formatDay(dateStr) {
  const d = new Date(dateStr);
  return d.toDateString();
}

// FETCH CHUNK OF VIDEOS
async function fetchVideos() {
  // get uploads playlist ID if first load
  if (!allVideoEntries.length) {
    const chRes = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=contentDetails&id=${CHANNEL_ID}&key=${API_KEY}`);
    const chData = await chRes.json();
    uploadsId = chData.items[0].contentDetails.relatedPlaylists.uploads;
  }

  const url = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet,contentDetails&playlistId=${uploadsId}&maxResults=${MAX_RESULTS}&pageToken=${nextPageToken}&key=${API_KEY}`;
  const res = await fetch(url);
  const data = await res.json();
  nextPageToken = data.nextPageToken || "";

  for (const item of data.items) {
    const vidId = item.contentDetails.videoId;
    const snippet = item.snippet;
    const title = snippet.title;
    const description = snippet.description;
    const publishedAt = snippet.publishedAt;

    // fetch location for each video
    const vidRes = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=recordingDetails&id=${vidId}&key=${API_KEY}`);
    const vidData = await vidRes.json();
    const loc = vidData.items[0].recordingDetails?.location;

    allVideoEntries.push({ vidId, title, description, publishedAt, loc });
  }

  renderFeed();
}

// RENDER FEED
function renderFeed(filter = "") {
  console.log("renderFeed "+allVideoEntries.length+" in list");
  const feed = document.getElementById("feed");
  feed.innerHTML = "";
  let lastDay = "";
  let rowCount = 0;

  const filtered = allVideoEntries.filter(v => v.title.toLowerCase().includes(filter.toLowerCase()));

  for (const entry of filtered) {
    const day = formatDay(entry.publishedAt);
    if (day !== lastDay) {
      rowCount++;
      lastDay = day;
    }

    const div = document.createElement("div");
    div.className = `entry ${rowCount % 2 === 0 ? "even" : "odd"}`;

    const left = document.createElement("div");
    const iframe = document.createElement("iframe");
    iframe.src = `https://www.youtube.com/embed/${entry.vidId}`;
    iframe.allowFullscreen = true;
    left.appendChild(iframe);

if (entry.loc) {
  const mapDiv = document.createElement("div");
  mapDiv.className = "map";
  left.appendChild(mapDiv);

  const map = L.map(mapDiv).setView(
    [entry.loc.latitude, entry.loc.longitude],
    15
  );

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap contributors"
  }).addTo(map);

  L.marker([entry.loc.latitude, entry.loc.longitude])
    .addTo(map)
    .bindPopup(entry.title);
}
    const right = document.createElement("div");
    right.className = "description";
    right.innerHTML = `<div class="title">${entry.title}</div>
                       <div class="date">${formatDate(entry.publishedAt)}</div>
                       ${entry.description}`;

    div.appendChild(left);
    div.appendChild(right);
    feed.appendChild(div);
  }
}

// SEARCH FILTER
const searchBox = document.getElementById("searchBox");
searchBox.addEventListener("input", () => {
  renderFeed(searchBox.value);
});

// LAZY SCROLL
window.addEventListener("scroll", () => {
  if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 100) {
    if (nextPageToken) {
      fetchVideos();
    }
  }
});

// INIT
fetchVideos();</script>
</body>
</html>
