<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Travel Log (Paginated)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <style>
  body { font-family: sans-serif; margin: 20px; background: #f0f0f0; }
  h1 { text-align: center; }
  
  #feed-table { 
    margin: 0 auto; 
    border-collapse: separate; 
    border-spacing: 0 15px; 
    table-layout: fixed; 
    width: 1000px; 
  }

  .entry-row {
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    border-radius: 6px;
  }
  
  .entry-row.even { background: #ffffff; }
  .entry-row.odd { background: #e9f5ff; }

  .col {
    vertical-align: top;
    padding: 10px;
  }

  .vid-col {
    width: 310px;
    border-radius: 6px 0 0 6px;
  }

  .map-col {
    width: 310px;
  }

  .text-col {
    width: auto; /* Flexible */
    border-radius: 0 6px 6px 0;
  }

  iframe, .map-container { 
    width: 300px; 
    height: 171px; 
    border: 0; 
    display: block;
  }

  .title { font-weight: bold; margin-bottom: 5px; }
  .date { font-size: 0.85em; color: #555; margin-bottom: 5px; }
  .description {
    overflow: hidden;
    max-height: 5em;
    transition: max-height 0.3s ease;
    cursor: pointer;
    white-space: pre-wrap;
  }

  .description.open {
    max-height: 50em;
  }

  .pagination-container {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 30px 0;
  }
  .pag-btn {
    padding: 10px 25px;
    font-size: 1rem;
    cursor: pointer;
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  .pag-btn:disabled { 
    opacity: 0.5; 
    cursor: not-allowed; 
  }
</style>
</head>
<body>

<h1 style="display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 1.8em;">
  Travel Log v27-02-2026-01:47
  <a href="https://www.youtube.com/channel/UCpmL04Tei28Vunnw2p-_zUw" target="_blank" style="text-decoration: none; color: red;">
    <svg height="24" width="24" viewBox="0 0 24 24" fill="red" xmlns="http://www.w3.org/2000/svg">
      <path d="M23.498 6.186c-.272-1.023-1.076-1.828-2.1-2.1C19.366 3.5 12 3.5 12 3.5s-7.366 0-9.398.586c-1.023.272-1.828 1.077-2.1 2.1C0 8.218 0 12 0 12s0 3.782.502 5.814c.272 1.023 1.077 1.828 2.1 2.1C4.634 20.5 12 20.5 12 20.5s7.366 0 9.398-.586c1.024-.272 1.828-1.077 2.1-2.1.502-2.032.502-5.814.502-5.814s0-3.782-.502-5.814zM9.75 15.02V8.98l6 3.02-6 3.02z"/>
    </svg>
  </a>
</h1>

<table id="feed-table">
  <!-- Slots generated by JS -->
</table>

<div class="pagination-container">
  <button id="prevBtn" class="pag-btn" disabled>← Newer</button>
  <button id="nextBtn" class="pag-btn">Older →</button>
</div>

<script>
var API_KEY = "AIzaSyARU1uXNPtCeA4MLX4so2VpVE028A4BNig"; 
var CHANNEL_ID = "UCpmL04Tei28Vunnw2p-_zUw";
var MAX_RESULTS = 10; 

var uploadsId = "";
var nextToken = "";
var prevToken = "";
var mapPool = []; 

function formatDate(dateStr) {
  return new Date(dateStr).toLocaleString();
}

function createSkeleton() {
  var table = document.getElementById("feed-table");
  for (var i = 0; i < 10; i++) {
    var row = document.createElement("tr");
    row.className = "entry-row " + (i % 2 === 0 ? "even" : "odd");
    row.style.display = "none";

    var vidCell = document.createElement("td");
    vidCell.className = "col vid-col";
    var iframe = document.createElement("iframe");
    iframe.id = "vid-" + i;
    vidCell.appendChild(iframe);

    var mapCell = document.createElement("td");
    mapCell.className = "col map-col";
    var mapDiv = document.createElement("div");
    mapDiv.className = "map-container";
    mapSiz = "300px"; // fixed size
    mapDiv.id = "mapdiv-" + i;
    mapCell.appendChild(mapDiv);

    var textCell = document.createElement("td");
    textCell.className = "col text-col";
    var descDiv = document.createElement("div");
    descDiv.className = "description";
    descDiv.id = "desc-" + i;
    descDiv.onclick = function() { this.classList.toggle('open'); };
    textCell.appendChild(descDiv);

    row.appendChild(vidCell);
    row.appendChild(mapCell);
    row.appendChild(textCell);
    table.appendChild(row);

    var map = L.map(mapDiv).setView([0, 0], 10);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);
    var marker = L.marker([0, 0]).addTo(map);
    
    mapPool.push({
      map: map,
      marker: marker,
      container: mapCell, 
      row: row
    });
  }
}

async function fetchVideos(token) {
  token = token || "";
  if (!uploadsId) {
    var chRes = await fetch("https://www.googleapis.com/youtube/v3/channels?part=contentDetails&id=" + CHANNEL_ID + "&key=" + API_KEY);
    var chData = await chRes.json();
    uploadsId = chData.items[0].contentDetails.relatedPlaylists.uploads;
  }

  var url = "https://www.googleapis.com/youtube/v3/playlistItems?part=snippet,contentDetails&playlistId=" + uploadsId + "&maxResults=" + MAX_RESULTS + "&pageToken=" + token + "&key=" + API_KEY;
  var res = await fetch(url);
  var data = await res.json();

  nextToken = data.nextPageToken || "";
  prevToken = data.prevPageToken || "";
  document.getElementById("nextBtn").disabled = !nextToken;
  document.getElementById("prevBtn").disabled = !prevToken;

  var currentEntries = [];
  for (var i = 0; i < data.items.length; i++) {
    var item = data.items[i];
    var vidId = item.contentDetails.videoId;
    var snippet = item.snippet;

    var vidRes = await fetch("https://www.googleapis.com/youtube/v3/videos?part=recordingDetails&id=" + vidId + "&key=" + API_KEY);
    var vidData = await vidRes.json();
    var loc = (vidData.items && vidData.items[0] && vidData.items[0].recordingDetails) ? vidData.items[0].recordingDetails.location : null;

    currentEntries.push({ 
      vidId: vidId, 
      title: snippet.title, 
      description: snippet.description, 
      publishedAt: snippet.publishedAt, 
      loc: loc 
    });
  }
  updateSlots(currentEntries);
}

function updateSlots(entries) {
  for (var i = 0; i < 10; i++) {
    var slot = mapPool[i];
    var entry = entries[i];

    if (entry) {
      slot.row.style.display = "table-row";
      document.getElementById("vid-" + i).src = "https://www.youtube.com/embed/" + entry.vidId;
      
      var descDiv = document.getElementById("desc-" + i);
      descDiv.classList.remove('open');
      descDiv.innerHTML = '<div class="title">' + entry.title + '</div>' +
                          '<div class="date">' + formatDate(entry.publishedAt) + '</div>' +
                          entry.description;

      if (entry.loc && entry.loc.latitude !== undefined && entry.loc.longitude !== undefined) {
        var lat = parseFloat(entry.loc.latitude);
        var lon = parseFloat(entry.loc.longitude);
        if (!isNaN(lat) && !isNaN(lon)) {
          slot.container.style.display = "table-cell";
          slot.map.setView([lat, lon], 10);
          slot.marker.setLatLng([lat, lon]);
          slot.marker.bindPopup(entry.title);
          setTimeout(function() { slot.map.invalidateSize(); }, 100);
        } else {
          slot.container.style.display = "none";
        }
      } else {
        slot.container.style.display = "none";
      }
    } else {
      slot.row.style.display = "none";
    }
  }
  window.scrollTo(0, 0);
}

document.getElementById("nextBtn").onclick = function() {
  if (nextToken) fetchVideos(nextToken);
};

document.getElementById("prevBtn").onclick = function() {
  if (prevToken) fetchVideos(prevToken);
};

createSkeleton();
fetchVideos();
</script>
</body>
</html>
