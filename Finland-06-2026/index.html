<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Travel Log (Paginated)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <style>
  body { font-family: sans-serif; margin: 20px; background: #f0f0f0; }
  h1 { text-align: center; }
  
  .entry {
  display: flex;
  flex-wrap: nowrap;
  gap: 10px;
  padding: 10px;
  border-radius: 6px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.entry > .left {
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex: 0 0 300px;
}

.entry > .left iframe,
.entry > .left .map {
  width: 100%;
  height: 171px;
}

.entry > .right {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.title { font-weight: bold; margin-bottom: 5px; }
.date { font-size: 0.85em; color: #555; margin-bottom: 5px; }
.description {
  overflow: hidden;
  max-height: 5em;
  transition: max-height 0.3s ease;
  cursor: pointer;
}

.description.open {
  max-height: 50em;
}
  .entry.even { background: #ffffff; }
  .entry.odd { background: #e9f5ff; }
  iframe, .map { width: 304px; height: 171px; border: 0; display: inline-block; }
  .description { max-width: 480px; white-space: pre-wrap; }
  .title { font-weight: bold; margin-bottom: 5px; }
  .date { font-size: 0.85em; color: #555; margin-bottom: 5px; }

  .pagination-container {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 30px 0;
  }
  .pag-btn {
    padding: 10px 25px;
    font-size: 1rem;
    cursor: pointer;
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  .pag-btn:disabled { 
    opacity: 0.5; 
    cursor: not-allowed; 
  }
</style>
</head>
<body>

<h1 style="display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 1.8em;">
  Travel Log v27-02-2026-01:47
  <a href="https://www.youtube.com/channel/UCpmL04Tei28Vunnw2p-_zUw" target="_blank" style="text-decoration: none; color: red;">
    <svg height="24" width="24" viewBox="0 0 24 24" fill="red" xmlns="http://www.w3.org/2000/svg">
      <path d="M23.498 6.186c-.272-1.023-1.076-1.828-2.1-2.1C19.366 3.5 12 3.5 12 3.5s-7.366 0-9.398.586c-1.023.272-1.828 1.077-2.1 2.1C0 8.218 0 12 0 12s0 3.782.502 5.814c.272 1.023 1.077 1.828 2.1 2.1C4.634 20.5 12 20.5 12 20.5s7.366 0 9.398-.586c1.024-.272 1.828-1.077 2.1-2.1.502-2.032.502-5.814.502-5.814s0-3.782-.502-5.814zM9.75 15.02V8.98l6 3.02-6 3.02z"/>
    </svg>
  </a>
</h1>

<div id="feed"></div>

<div class="pagination-container">
  <button id="prevBtn" class="pag-btn" disabled>← Newer</button>
  <button id="nextBtn" class="pag-btn">Older →</button>
</div>

<script>
var API_KEY = "AIzaSyARU1uXNPtCeA4MLX4so2VpVE028A4BNig"; 
var CHANNEL_ID = "UCpmL04Tei28Vunnw2p-_zUw";
var MAX_RESULTS = 10; 

var uploadsId = "";
var nextToken = "";
var prevToken = "";

function formatDate(dateStr) {
  var d = new Date(dateStr);
  return d.toLocaleString();
}
function formatDay(dateStr) {
  var d = new Date(dateStr);
  return d.toDateString();
}

async function fetchVideos(token) {
  token = token || "";
  
  if (!uploadsId) {
    var chRes = await fetch("https://www.googleapis.com/youtube/v3/channels?part=contentDetails&id=" + CHANNEL_ID + "&key=" + API_KEY);
    var chData = await chRes.json();
    uploadsId = chData.items[0].contentDetails.relatedPlaylists.uploads;
  }

  var url = "https://www.googleapis.com/youtube/v3/playlistItems?part=snippet,contentDetails&playlistId=" + uploadsId + "&maxResults=" + MAX_RESULTS + "&pageToken=" + token + "&key=" + API_KEY;
  var res = await fetch(url);
  var data = await res.json();

  nextToken = data.nextPageToken || "";
  prevToken = data.prevPageToken || "";

  document.getElementById("nextBtn").disabled = !nextToken;
  document.getElementById("prevBtn").disabled = !prevToken;

  var currentEntries = [];
  for (var i = 0; i < data.items.length; i++) {
    var item = data.items[i];
    var vidId = item.contentDetails.videoId;
    var snippet = item.snippet;

    var vidRes = await fetch("https://www.googleapis.com/youtube/v3/videos?part=recordingDetails&id=" + vidId + "&key=" + API_KEY);
    var vidData = await vidRes.json();
    var loc = (vidData.items && vidData.items[0] && vidData.items[0].recordingDetails) ? vidData.items[0].recordingDetails.location : null;

    currentEntries.push({ 
      vidId: vidId, 
      title: snippet.title, 
      description: snippet.description, 
      publishedAt: snippet.publishedAt, 
      loc: loc 
    });
  }
  renderFeed(currentEntries);
}

function renderFeed(entries) {
  var feed = document.getElementById("feed");
  feed.innerHTML = "";
  var lastDay = "";
  var rowCount = 0;

  for (var i = 0; i < entries.length; i++) {
    var entry = entries[i];
    var day = formatDay(entry.publishedAt);
    if (day !== lastDay) {
      rowCount++;
      lastDay = day;
    }

    var div = document.createElement("div");
    div.className = "entry " + (rowCount % 2 === 0 ? "even" : "odd");

    var left = document.createElement("div");
    left.className = "left";

    var iframe = document.createElement("iframe");
    iframe.src = "https://www.youtube.com/embed/" + entry.vidId;
    iframe.allowFullscreen = true;
    left.appendChild(iframe);

    if (entry.loc) {
      var mapDiv = document.createElement("div");
      mapDiv.className = "map";
      left.appendChild(mapDiv);

      setTimeout(function() {
        var map = L.map(mapDiv).setView(
          [entry.loc.latitude, entry.loc.longitude],
          10
        );

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          attribution: "&copy; OpenStreetMap contributors"
        }).addTo(map);

        L.marker([entry.loc.latitude, entry.loc.longitude])
          .addTo(map)
          .bindPopup(entry.title);

        map.invalidateSize();
      }, 0);
    }

    var right = document.createElement("div");
    right.className = "description";
    right.innerHTML = '<div class="title">' + entry.title + '</div>' +
                     '<div class="date">' + formatDate(entry.publishedAt) + '</div>' +
                     entry.description;

    div.appendChild(left);
    div.appendChild(right);
    feed.appendChild(div);
  }
  
  attachDescriptionToggle();
  window.scrollTo(0, 0);
}

function attachDescriptionToggle() {
  var descs = document.querySelectorAll('.description');
  for (var i = 0; i < descs.length; i++) {
    var desc = descs[i];
    if (!desc.dataset.toggleAttached) {
      desc.onclick = function() {
        this.classList.toggle('open');
      };
      desc.dataset.toggleAttached = "true";
    }
  }
}

document.getElementById("nextBtn").onclick = function() {
  if (nextToken) fetchVideos(nextToken);
};

document.getElementById("prevBtn").onclick = function() {
  if (prevToken) fetchVideos(prevToken);
};

fetchVideos();
</script>
</body>
</html>
